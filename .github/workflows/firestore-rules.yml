# firestore.rules is the tenant boundary — a mistake there exposes one customer's
# data to another. This runs on every change to the rules or the suite itself.
name: Firestore rules

on:
  push:
    paths:
      - 'firestore.rules'
      - 'tests/rules/**'
      - '.github/workflows/firestore-rules.yml'
  pull_request:
    paths:
      - 'firestore.rules'
      - 'tests/rules/**'
      - '.github/workflows/firestore-rules.yml'
  workflow_dispatch:

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/rules/package-lock.json
      - name: Install
        working-directory: tests/rules
        run: npm ci
      - name: Check rules syntax
        working-directory: tests/rules
        run: node syntaxcheck.js
      - name: Run rules tests
        working-directory: tests/rules
        run: node rules_test.js
